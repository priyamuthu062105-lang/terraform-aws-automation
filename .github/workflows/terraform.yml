
name: Terraform AWS Automation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-check:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          url += "&audience=sts.amazonaws.com"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " +
                  os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              }
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("OIDC subject:", claims.get("sub"))
          print("OIDC audience:", claims.get("aud"))
          print("Repository:", claims.get("repository"))
          print("Git ref:", claims.get("ref"))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::359013545320:role/GitHubActions-Project03-Role
          aws-region: ap-south-1

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform
        run: terraform validate -no-color
